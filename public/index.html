<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launchpad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Launchpad</h1>
    <p>Upcoming releases and what still blocks them.</p>
  </header>
  <main>
    <section aria-labelledby="releases-title">
      <h2 id="releases-title">Releases</h2>
      <label class="search">Search <input id="search" type="search" placeholder="Name or owner"></label>
      <ul id="releases" class="releases"></ul>
      <p class="hint">Keyboard: <kbd>j</kbd>/<kbd>k</kbd> move, <kbd>Enter</kbd> opens details, <kbd>Esc</kbd> closes.</p>
      <button id="load-more" type="button" class="load-more" hidden>Load more</button>
    </section>
    <aside aria-labelledby="activity-title">
      <section id="details" class="details" role="region" aria-labelledby="details-title" hidden>
        <button id="details-close" type="button" class="details-close">Close</button>
        <div id="details-body"></div>
      </section>
      <h2 id="activity-title">Activity</h2>
      <ol id="activity" class="activity"></ol>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
