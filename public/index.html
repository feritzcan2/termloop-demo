<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launchpad</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="theme.mjs"></script>
</head>
<body>
  <header>
    <div>
      <h1>Launchpad</h1>
      <p>Upcoming releases and what still blocks them.</p>
    </div>
    <fieldset class="theme" id="theme">
      <legend>Theme</legend>
      <label><input type="radio" name="theme" value="system"> System</label>
      <label><input type="radio" name="theme" value="light"> Light</label>
      <label><input type="radio" name="theme" value="dark"> Dark</label>
    </fieldset>
  </header>
  <main>
    <section aria-labelledby="releases-title">
      <h2 id="releases-title">Releases</h2>
      <label class="search">Search <input id="search" type="search" placeholder="Name or owner"></label>
      <ul id="releases" class="releases"></ul>
      <nav id="pager" class="pager" aria-label="Release pages"></nav>
    </section>
    <aside aria-labelledby="activity-title">
      <h2 id="activity-title">Activity</h2>
      <ol id="activity" class="activity"></ol>
    </aside>
  </main>
  <footer class="updated"><p>Updated <time id="updated"></time></p></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
